name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unlimited.systems
          NEXT_PUBLIC_WA_NUMBER: "34600000000"

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unlimited.systems
          NEXT_PUBLIC_WA_NUMBER: "34600000000"
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://unlimited.systems
          NEXT_PUBLIC_WA_NUMBER: "34600000000"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
